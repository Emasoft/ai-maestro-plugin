[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-maestro-plugin"
version = "3.0.0"
description = "AI agent orchestration plugin for Claude Code"
license = {text = "MIT"}
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "pyyaml",
    "types-PyYAML",
]

[tool.ruff]
line-length = 120
# Test fixtures are deliberately-malformed sample data that exercise this
# plugin's validators/tests — ruff must never lint or format them locally
# (e.g. `ruff check scripts/ tests/`) or it would "correct" the defects the
# tests depend on. Mirrors the Mega-Linter FILTER_REGEX_EXCLUDE used in CI.
extend-exclude = ["**/fixtures", "**/testdata", "**/__fixtures__"]

[tool.ruff.lint]
# Parity with CI's Mega-Linter: PYTHON_RUFF_ARGUMENTS = "--select=E,F,W,I --ignore=E501".
# Pinning it here makes the local `ruff check` (publish.py gate G2) agree with CI.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.hatch.build.targets.wheel]
# This is a Claude Code plugin, not a Python wheel. The pyproject.toml
# exists only for tool configuration (ruff, pytest, uv). Hatchling needs
# at least one package target to not crash on `uv run`.
packages = ["scripts"]
