name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create/edit the GitHub Release + attach assets
      actions: read         # anchore/sbom-action needs this to attach the SBOM as a release asset
      id-token: write       # attest-build-provenance: mint the OIDC token for the signed attestation
      attestations: write   # attest-build-provenance: persist the build-provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # Release only reads the tree + publishes via `gh` (GH_TOKEN); it never
          # `git push`es, so the checkout token must not persist into .git/config
          # (zizmor artipacked). Pinned to the SAME checkout SHA as ci.yml.
          persist-credentials: false

      # Pre-push hook integrity (TRDD-71a2239a): MUST stay byte-identical with
      # the same step in ci.yml (CI/Release-parity — Release diverges/times out
      # when a step lives only in ci.yml). The static committed .githooks/pre-push
      # must match its committed sha256 pin; editing the hook without re-pinning
      # in the SAME commit fails here. Plain `sha256sum -c`, no third-party action.
      - name: Verify pre-push hook sha256 pin
        run: sha256sum -c .githooks/pre-push.sha256

      - name: Install uv
        # zizmor: ignore[cache-poisoning]
        # setup-uv enables its package cache by default. This workflow fires ONLY
        # on an owner-created `v*.*.*` tag push (never a fork PR), so there is no
        # untrusted-writer path to poison the cache the release reads.
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      # Cross-run CPV scan-cache — MUST mirror ci.yml's step verbatim (same
      # action SHA / path / key / restore-keys) so the Release validate step
      # restores the SAME warm ~/.cache/cpv that CI already populated on the
      # release commit. Without it the Release validate ran COLD and timed out
      # at 25 min while CI passed in ~3 min on the identical commit, killing
      # the run before publishing and shipping zero-asset releases
      # (Emasoft/claude-plugins-validation#114). The cache key hashes
      # .cpv-self-hashes.json so a CPV-source change busts it; the same-OS
      # restore-keys fallback still warms the first run after a CPV bump.
      - name: Restore CPV scan-cache
        # zizmor: ignore[cache-poisoning]
        # This cache is required (Emasoft/claude-plugins-validation#114: without
        # the warm ~/.cache/cpv the Release validate ran COLD and timed out). The
        # workflow fires ONLY on an owner tag push (never a fork PR), so there is
        # no untrusted-writer path to poison it; the key hashes .cpv-self-hashes.json.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cpv
          key: cpv-scan-cache-${{ runner.os }}-${{ hashFiles('**/.cpv-self-hashes.json') }}
          restore-keys: |
            cpv-scan-cache-${{ runner.os }}-

      - name: Run full plugin validation (remote CPV, --strict)
        # Bound the remote uvx CPV fetch so a transient git-fetch stall fails
        # fast (rerunnable) instead of hanging the release — see
        # Emasoft/claude-plugins-validation#90. 25 min (not 12): a COLD CI
        # runner pays for the uvx CPV build PLUS the whole-repo 15-language
        # lint (each linter installed on demand); on this plugin that
        # legitimately exceeds 12 min cold (≈7 s locally with warm caches).
        # 25 min bounds a genuine infinite stall well below the 6-hour default.
        timeout-minutes: 25
        # Fetches CPV from GitHub so downstream plugins do not need to
        # vendor a local validator script. Matches publish.py's local
        # gate and the CI validate job. --strict blocks on CRITICAL /
        # MAJOR / MINOR / NIT (exit codes 1-4); WARNING (exit 5+) is
        # advisory only. Issue #11: removed the local validator
        # invocation entirely; always go through the remote uvx entry.
        env:
          # See the ci.yml validate step: without this, `tee` below forwards a
          # buffer nothing has flushed, so a killed run still shows nothing.
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          # NOTE: no backticks anywhere in these comments. Backticks are
          # command-substitution syntax to a shell, so CPV's injection scanner
          # flags them inside a run: block even in a comment -- an earlier
          # draft of this block scored a CMD_INJECTION NIT for the word "cat"
          # in markdown quotes, which is a real red gate for a fake problem.
          #
          # Piping to tee, rather than redirecting to a file and cat-ing it
          # afterwards: with the redirect a killed job never reaches the cat
          # and the log is EMPTY -- which is how the v2.11.0 timeout hid its
          # own cause. With tee, whatever flushed is already in the log.
          #
          # Reading the exit status is LOAD-BEARING and must use PIPESTATUS.
          # GitHub's default run: shell is "bash -e {0}" WITHOUT -o pipefail,
          # so a bare exit_code=$? after the pipe captures TEE's status
          # (~always 0) and this gate would report success for EVERY failed
          # validation -- strictly worse than the hang it replaced, because a
          # hang is loud. pipefail alone is not enough either: it yields the
          # RIGHTMOST non-zero status, so a tee write error would mask CPV's
          # real severity (a NIT=4 reported as 1=CRITICAL). PIPESTATUS[0] is
          # CPV's own verdict regardless of tee.
          #
          # The array must be captured in ONE expansion: any later command --
          # including a plain assignment -- resets PIPESTATUS.
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation@v5.4.0 \
              --with pyyaml \
              cpv-remote-validate plugin . --strict 2>&1 | tee validation-report.txt
          pipe_rc=("${PIPESTATUS[@]}")
          exit_code="${pipe_rc[0]}"
          tee_rc="${pipe_rc[1]}"
          set -e
          # A failed tee means the report was never written. Fail loudly rather
          # than let a silent write error look like a clean validation.
          if [ "$tee_rc" -ne 0 ]; then
            echo "::error::tee failed (exit $tee_rc) -- validation-report.txt is unreliable"
            exit 1
          fi
          if [ "$exit_code" -ge 1 ] && [ "$exit_code" -le 4 ]; then
            echo "::error::Validation failed with exit code $exit_code (CRITICAL/MAJOR/MINOR/NIT found)"
            exit "$exit_code"
          fi

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            uv run pytest tests/ -v
          fi

      - name: Lint Python scripts
        run: uv run ruff check scripts/

      - name: Type check
        run: uv run mypy scripts/ --ignore-missing-imports

      - name: Generate changelog
        id: changelog
        # v2.86.0 hardening (issue #22): extract ONLY the matching
        # ``## [X.Y.Z] — YYYY-MM-DD`` block from CHANGELOG.md instead of
        # uploading the entire file. The release body should be the
        # release-specific notes, not the whole project history.
        # Fallback chain:
        #   1. CHANGELOG.md ## [version] section (curated, em-dash separator)
        #   2. CHANGELOG.md ## [version] section (legacy hyphen separator)
        #   3. Full CHANGELOG.md (when no section header matches)
        #   4. Auto-generated git log (when no CHANGELOG.md at all)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # Strip leading 'v' so v1.2.3 matches ## [1.2.3] — ...
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            GITLOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            GITLOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD")
          fi
          if [ -f "CHANGELOG.md" ]; then
            # Extract the section header through the next ## or EOF. Try
            # em-dash (canonical) first, then legacy hyphen. awk prints
            # the block bounded by the matching header and the NEXT
            # `## ` at column 0 (or EOF).
            SECTION=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\] [—-] " {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION" > changelog.txt
              echo "::notice::Release body extracted from CHANGELOG.md section for $VERSION"
            else
              echo "::warning::No CHANGELOG.md section matched ## [$VERSION] — falling back to full CHANGELOG.md"
              cp CHANGELOG.md changelog.txt
            fi
          else
            echo "$GITLOG" > changelog.txt
          fi
          echo "changelog_file=changelog.txt" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release (idempotent)
        # Idempotent shell flow — replaces the `softprops/action-gh-release`
        # action which 422s when publish.py's Gate-13 already created the
        # release locally. Pattern: `gh release view` to detect existence,
        # then `gh release edit` (with --notes-file fallback to existing body)
        # OR `gh release create` (when not pre-existing). Both branches
        # upload the validation-report artifact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — editing in place"
            gh release edit "$TAG"               --notes-file changelog.txt               --verify-tag
            gh release upload "$TAG" validation-report.txt --clobber
          else
            echo "Release $TAG does not exist yet — creating"
            gh release create "$TAG" validation-report.txt               --title "$TAG"               --notes-file changelog.txt               --verify-tag
          fi

      # Software Bill of Materials (provenance-audit MAJOR fix): syft scans the
      # repo and emits a CycloneDX-JSON SBOM, then attaches it to the release
      # this tag-push created above. upload-release-assets defaults true and
      # targets the release for the current tag, so this MUST run AFTER the
      # release exists. The SBOM lists every dependency that went into the
      # shipped artifacts, enabling downstream CVE/license auditing.
      # Third-party action → SHA-pinned (anchore/sbom-action v0.24.0).
      - name: Generate SBOM and attach to release
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: ai-maestro-plugin.cyclonedx.json
          artifact-name: ai-maestro-plugin.cyclonedx.json
          upload-release-assets: true

      # Build-provenance attestation for the assets this release publishes.
      # REGRESSION GUARD (2026-08-02): the ONLY attest-build-provenance step in
      # this repo used to live in the build-memgrep job. Removing that job with
      # the crate (6cceb62, ai-maestro#106) silently took CORE's provenance with
      # it, while the release kept shipping validation-report.txt and the SBOM —
      # caught by the janitor's provenance-audit as a MAJOR the same night.
      # The lesson generalises: deleting a job deletes every CROSS-CUTTING
      # control that happened to be hosted in it, not just the job's own
      # purpose. Grep for the control, not for the feature, before removing.
      # Runs LAST so both subject files exist in the workspace.
      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            validation-report.txt
            ai-maestro-plugin.cyclonedx.json
