version: 2

# Every third-party action in this repo is SHA-pinned (a supply-chain
# requirement, and CI enforces it). A SHA pin cannot be bumped by a tag moving,
# which is the point -- but it also means nothing surfaces upstream releases or
# security advisories. Without this file the pins simply rot: the protection
# quietly becomes staleness. Dependabot is the update channel that makes
# pinning safe to keep.
#
# Dependabot rewrites the SHA *and* the trailing `# vX.Y.Z` comment together,
# so the pinned form survives its PRs.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      # Off the hour -- every repo that asks for "weekly" lands on 00:00 UTC.
      time: "06:17"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  # NO cargo ecosystem here. CORE used to vendor the memgrep crate at
  # /scripts/memgrep and ship prebuilt binaries; ownership moved to the
  # ai-maestro-janitor (Emasoft/ai-maestro#106) and the crate was removed, so a
  # cargo entry pointing at a directory that no longer exists would scan nothing
  # while still LOOKING like Rust coverage -- the exact false-assurance shape
  # that let a vulnerable crate sit unnoticed here before (see architecture.md
  # ATOM-ARCH-0003: 0 open alerts while 5 of 141 packages carried advisories).
  # The janitor owns that scanning now.

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:29"
    open-pull-requests-limit: 5
    commit-message:
      # MUST be a conventional-commit type. `.commitlintrc.json` extends
      # config-conventional, whose type-enum is [build chore ci docs feat fix
      # perf refactor revert style test] — `deps` is not in it, so every PR this
      # ecosystem opened failed the Commitlint job by construction. The
      # github-actions ecosystem above already uses `ci` and passes.
      prefix: "chore"
    labels:
      - dependencies
      - python
