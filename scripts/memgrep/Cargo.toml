[package]
name = "memgrep"
version = "0.1.0"
edition = "2024"

[dependencies]
# 1.0.103 is the floor, not a preference: 1.0.102 carries RUSTSEC-2026-0190
# (unsoundness -- Error::context() followed by Error::downcast_mut() violates
# borrow rules and is UB). Do not lower this.
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
comrak = "0.54.0"
globset = "0.4.18"
ignore = "0.4.26"
regex = "1.12.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
